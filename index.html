<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Katy Translate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hdr">
  <button class="iconbtn light" id="newImageBtn" aria-label="Close photo">✕</button>
  <span class="hdr-title">Tap or swipe the text you want to translate</span>
</header>

<main class="wrap">
  <section id="dropzone" class="dropzone">
    <div class="dz-title">Translate text in a photo</div>
    <div class="hint">Point at text in almost any language. The English translation appears here.</div>
    <div class="dz-actions">
      <button class="btn primary" id="cameraBtn">📷 Take photo</button>
      <button class="btn" id="uploadBtn">Upload photo</button>
    </div>
  </section>
  <input id="fileInput" type="file" accept="image/*" hidden />
  <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />

  <section id="app" style="display:none;">
    <div class="bar white">
      <div id="selectionText"></div>
      <button class="xbtn" id="clearSelectionBtn" aria-label="Clear selection">✕</button>
    </div>
    <div class="bar blue" id="translationBar">
      <div id="translationResult"></div>
    </div>

    <div class="stage" id="stage">
      <img id="mainImage" alt="photo to translate" />
      <div id="scanOverlay" class="scanOverlay" style="display:none;"><span>Reading the photo…</span></div>
    </div>

    <div class="controls">
      <button class="btn" id="selectAllBtn">☑ Select all</button>
      <button class="btn" id="clearAllBtn">Clear</button>
      <button class="btn" id="scanBtn">Scan again</button>
      <button class="btn" id="newPhotoBtn">📷 New photo</button>
    </div>
    <div class="status" id="status"></div>
    <div class="hint" id="localEngineStatus" style="display:none;"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
